volumes:
  mongo_data:

services:
  servicetest:
    image: servicetest
    build:
      context: .              
      dockerfile: servicetest/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - GatewayUrl=http://http:8080 
    depends_on:
      - http

  mongo:
      image: mongo:7.0
      restart: always
      platform: linux/amd64
      command: ["mongod", "--quiet", "--logpath", "/dev/null"]
      ports:
        - "27017:27017"
      volumes:
        - mongo_data:/data/db

  http:
    image: http
    build:
      context: .
      dockerfile: http/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - SecretKey=${JWT_SECRET_KEY:?set it in .env (see .env.example)}
      - GrpcServices__UsersService=http://users:8080
      - GrpcServices__ForumService=http://forum:8080
      - GrpcServices__ImagesService=http://images:8080
    depends_on:
      - users
      - forum
      - images

  users:
    image: users
    build:
      context: .              
      dockerfile: users/Dockerfile
    ports:
      - "5001:8080"           
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - SecretKey=${JWT_SECRET_KEY:?set it in .env (see .env.example)}
      - MongoDB__ConnectionString=mongodb://mongo:27017/
      - MongoDB__DatabaseName=users
      - BrevoSettings__ApiKey=${BREVO_API_KEY}
      - BrevoSettings__ApiUrl=https://api.brevo.com/v3/smtp/email
      - BrevoSettings__EmailFrom=${BREVO_EMAIL_FROM}
      - BrevoSettings__SenderName=Forum
      - VonageSettings__ApiKey=${VONAGE_API_KEY}
      - VonageSettings__ApiSecret=${VONAGE_API_SECRET}
      - VonageSettings__TargetPhoneNumber=${VONAGE_TARGET_PHONE_NUMBER}
      - VonageSettings__SenderName=Vonage APIs
    depends_on:
      - mongo
  
  forum:
    image: forum
    build:
      context: .              
      dockerfile: forum/Dockerfile
    ports:
      - "5002:8080"           
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://mongo:27017/
      - MongoDB__DatabaseName=forum
      - GrpcServices__UsersService=http://users:8080
    depends_on:
      - mongo
      - users

  images:
    image: images
    build:
      context: .              
      dockerfile: images/Dockerfile
    ports:
      - "5003:8080"           
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDB__ConnectionString=mongodb://mongo:27017/
      - MongoDB__DatabaseName=images
    volumes:
      - ./FileStorage:/app/FileStorage
    depends_on:
      - mongo
