syntax = "proto3";

import "Protos/common.proto";

option csharp_namespace = "votesServiceClient";

package votesService;

service VotesService {
  rpc CastVote (CastVoteRequest) returns (commons.protos.MessageResponse);
  rpc GetVoteCount (GetVoteCountRequest) returns (commons.protos.MessageResponse);
}

message CastVoteRequest {
  string userId = 1;
  string postId = 2;
  int32 type = 3;      // 0 = question, 1 = answer
  int32 voteValue = 4; // 1 = upvote, 0 = downvote
}

message GetVoteCountRequest {
  string postId = 1;
  int32 type = 2;      // 0 = question, 1 = answer
}