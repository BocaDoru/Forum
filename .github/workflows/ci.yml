name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-checks:
    name: Frontend Lint & Tests (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ForumFrontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ForumFrontend/package-lock.json
          
      - name: Install dependencies
        run: npm install
        
      - name: Run Linter (Code Quality)
        continue-on-error: true
        run: npm run lint
        
      - name: Run Vitest
        continue-on-error: true
        run: npm run test

  backend-checks:
    name: Backend Build & Lint (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ForumBackend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Check Formatting (Code Quality)
        continue-on-error: true
        run: dotnet format --verify-no-changes
        
      - name: Build Microservices & Gateway
        run: dotnet build

  e2e-testing:
    name: E2E Architecture Tests (Docker + Console)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET (for test console app)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Start Architecture (Docker Compose)
        working-directory: ForumBackend
        run: docker compose up -d
        
      - name: Wait for Environment Initialization
        run: sleep 20
        
      - name: Run E2E Console Tests
        working-directory: ForumBackend/servicetest
        continue-on-error: true
        run: dotnet run
        
      - name: Tear Down Architecture
        working-directory: ForumBackend
        run: docker compose down