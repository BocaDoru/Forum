name: Assignment 3 CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-checks:
    name: Frontend Lint & Tests (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ForumFrontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ForumFrontend/package-lock.json
          
      - name: Install dependencies
        run: npm install
        
      - name: Run Linter
        continue-on-error: true
        run: npm run lint
        
      - name: Run Vitest
        continue-on-error: true
        run: npm run test

  backend-e2e-pipeline:
    name: Backend Build & E2E Tests (Docker Compose)
    runs-on: ubuntu-latest
    env:
      # docker-compose.yml reads its secrets from the environment (locally: ForumBackend/.env).
      # CI has no .env, so it gets a throwaway key here; the E2E tests send no emails or SMS.
      JWT_SECRET_KEY: ci-only-jwt-signing-key-not-used-anywhere-else
      BREVO_API_KEY: ""
      BREVO_EMAIL_FROM: ""
      VONAGE_API_KEY: ""
      VONAGE_API_SECRET: ""
      VONAGE_TARGET_PHONE_NUMBER: ""
    defaults:
      run:
        working-directory: ForumBackend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET (for formatting checks)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          
      - name: Check Formatting (Code Quality)
        continue-on-error: true
        run: find . -name "*.csproj" -exec dotnet format {} --verify-no-changes \;
        
      - name: Run Architecture & E2E Tests
        continue-on-error: true
        run: docker compose up --build --abort-on-container-exit --exit-code-from servicetest